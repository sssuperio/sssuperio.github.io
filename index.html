<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>sssuper.io — Coming Soon</title>
    <style>
      :root {
        --bg: #f5f1e8;
        --fg: #101010;
        --line: #101010;
        --accent: #e62323;
        --speed: 2800ms;
      }

      * {
        box-sizing: border-box;
        margin: 0;
      }

      html,
      body {
        width: 100%;
        min-height: 100%;
        background: repeating-linear-gradient(
          0deg,
          var(--bg),
          var(--bg) 36px,
          #efe9dd 36px,
          #efe9dd 37px
        );
        color: var(--fg);
        font-family:
          "Arial Black", Impact, "Helvetica Neue", Helvetica, Arial, sans-serif;
        animation: bgShift 7s linear infinite;
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 3vw;
      }

      main {
        width: min(1100px, 100%);
        border: 4px solid var(--line);
        background: var(--bg);
        padding: clamp(20px, 3vw, 42px);
        box-shadow: 12px 12px 0 var(--line);
        position: relative;
        overflow: hidden;
      }

      main::after {
        content: "";
        position: absolute;
        top: 0;
        left: -26%;
        width: 22%;
        height: 100%;
        background: var(--accent);
        opacity: 0.11;
        animation: barSlide 4.2s linear infinite;
        pointer-events: none;
      }

      .tag {
        display: inline-block;
        border: 3px solid var(--line);
        padding: 4px 10px;
        font-size: clamp(12px, 1.3vw, 15px);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        margin-bottom: clamp(14px, 2vw, 24px);
      }

      h1 {
        font-size: clamp(44px, 10vw, 136px);
        line-height: 0.9;
        letter-spacing: -0.04em;
        text-transform: uppercase;
        margin-bottom: clamp(14px, 2vw, 24px);
        text-wrap: balance;
      }

      .company {
        display: inline-block;
        color: var(--bg);
        background: var(--fg);
        padding: 0.04em 0.12em 0.06em;
        line-height: 0.8;
        margin-top: 0.08em;
      }

      .strip {
        margin-top: clamp(16px, 2vw, 22px);
        border: 3px solid var(--line);
        overflow: hidden;
        white-space: nowrap;
        width: 100%;
        font-size: clamp(16px, 2.1vw, 28px);
        font-weight: 700;
        line-height: 1.1;
        text-transform: uppercase;
        background: var(--bg);
        padding: 6px 0;
      }

      .strip span {
        display: inline-block;
        padding-left: 100%;
        animation: tape 12s linear infinite;
      }

      .cta-wrap {
        margin-top: clamp(16px, 2.2vw, 24px);
      }

      .cta {
        display: inline-block;
        border: 3px solid var(--line);
        background: var(--accent);
        color: var(--bg);
        text-decoration: none;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-size: clamp(14px, 1.6vw, 18px);
        padding: 10px 14px;
        box-shadow: 6px 6px 0 var(--line);
        transition:
          transform 120ms ease,
          box-shadow 120ms ease;
      }

      .cta:hover,
      .cta:focus-visible {
        transform: translate(2px, 2px);
        box-shadow: 4px 4px 0 var(--line);
      }

      footer {
        margin-top: clamp(16px, 2.8vw, 30px);
        padding-top: clamp(12px, 1.5vw, 18px);
        border-top: 3px solid var(--line);
        font-size: clamp(12px, 1.2vw, 14px);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        display: flex;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
      }

      @keyframes tape {
        0% {
          transform: translateX(0);
        }
        100% {
          transform: translateX(-100%);
        }
      }

      @keyframes barSlide {
        0% {
          transform: translateX(0) skewX(-12deg);
        }
        100% {
          transform: translateX(640%) skewX(-12deg);
        }
      }

      @keyframes bgShift {
        0% {
          background-position-y: 0;
        }
        100% {
          background-position-y: 37px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        * {
          animation: none !important;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="tag">Type / Algo / Studio</div>
      <h1>
        Coming
        <br />
        Soon
        <br />
        <span class="company">sssuper.io</span>
      </h1>
      <div class="strip">
        <span
          >Algorithmic Type Systems / Algorithmic Foundry / Brutalist Interfaces
          / sssuper.io /
        </span>
      </div>
      <div class="cta-wrap">
        <a
          class="cta"
          href="https://chirone.sssuper.io"
          target="_blank"
          rel="noopener noreferrer"
          >Chirone molecular/pixel font editor</a
        >
      </div>
      <footer>
        <span>Launching soon</span>
        <span>hello@sssuper.io</span>
      </footer>
    </main>
  </body>
</html>
